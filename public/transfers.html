<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfers - Trip Expense Manager</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🎒 Trip Expense Manager</div>
        <div class="nav-menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="upload.html">Upload Receipt</a>
            <a href="transfers.html" class="active">Transfers</a>
            <a href="reports.html">Reports</a>
            <a href="admin.html" id="adminLink" class="admin-only hidden">Admin</a>
            <div class="user-info">
                <span id="userName"></span>
                <button id="logoutBtn" class="btn btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Money Transfers</h1>
            <p>Record payments and money transfers between team members</p>
        </div>

        <div class="content-grid">
            <div class="card">
                <div class="card-header">
                    <h2>Add New Transfer</h2>
                </div>
                <form id="transferForm" class="transfer-form">
                    <div class="form-group">
                        <label for="tripSelect">Trip *</label>
                        <select id="tripSelect" required>
                            <option value="">Select trip...</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="payerName">From (Payer) *</label>
                            <input type="text" id="payerName" required placeholder="Your name">
                        </div>

                        <div class="form-group">
                            <label for="payeeName">To (Payee) *</label>
                            <input type="text" id="payeeName" required placeholder="Person/Organization">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="amount">Amount (₹) *</label>
                            <input type="number" id="amount" required min="0" step="0.01" placeholder="0.00">
                        </div>

                        <div class="form-group">
                            <label for="date">Date *</label>
                            <input type="date" id="date" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="txnId">Transaction ID / Reference</label>
                        <input type="text" id="txnId" placeholder="UPI ID, Cheque no., etc.">
                    </div>

                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" rows="2" placeholder="Additional details..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="proofFile">Upload Proof (Optional)</label>
                        <div class="file-upload-area" id="fileUploadArea">
                            <input type="file" id="proofFile" accept="image/*,.pdf" hidden>
                            <div class="file-upload-placeholder">
                                <span class="upload-icon">📎</span>
                                <p>Click to upload payment proof</p>
                                <p class="file-info">JPG, PNG, PDF (Max 10MB)</p>
                            </div>
                            <div class="file-preview hidden" id="filePreview">
                                <p id="fileName"></p>
                                <button type="button" class="btn btn-sm" id="removeFile">Remove</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="reset" class="btn btn-secondary">Clear</button>
                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            <span id="submitText">Record Transfer</span>
                            <span id="uploadProgress" class="hidden">Saving...</span>
                        </button>
                    </div>
                </form>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Recent Transfers</h2>
                    <div class="filter-group">
                        <select id="filterTrip" class="form-select">
                            <option value="">All trips</option>
                        </select>
                    </div>
                </div>
                <div class="transfers-list" id="transfersList">
                    <p class="loading">Loading transfers...</p>
                </div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification hidden"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/transfers.js"></script>
</body>
</html>
