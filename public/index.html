<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Expense Manager - Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container login-container">
        <div class="login-card">
            <div class="logo">
                <h1>🎒 Trip Expense Manager</h1>
                <p>Mumbai College Trip - Expense Tracking System</p>
            </div>

            <div class="login-methods">
                <button id="googleSignIn" class="btn btn-google">
                    <span>🔐</span> Sign in with Google
                </button>

                <div class="divider">
                    <span>OR</span>
                </div>

                <form id="emailLoginForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="your.email@college.edu" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter password" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Sign In</button>
                </form>

                <div class="toggle-form">
                    <p>Don't have an account? <a href="#" id="toggleSignup">Sign up</a></p>
                </div>
            </div>

            <div class="info-section">
                <p>📋 For team members participating in the Mumbai trip</p>
                <p>🔒 Secure expense tracking and reimbursement management</p>
            </div>
        </div>
    </div>

    <div id="notification" class="notification hidden"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
